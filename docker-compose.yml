version: "3.8"

# Infrastructure Project: RAG Service, ChromaDB, and Redis
# This project creates the shared-infra-network that other projects connect to
# Project name: infra
# Location: /home/postgres/rag-infrastructure/docker-compose.yml

services:
  # Python RAG Service
  rag-service:
    build:
      context: .
      dockerfile: Dockerfile.rag
    container_name: rag-service
    ports:
      - "8001:8001"
    env_file:
      - .env.local
    environment:
      # Docker network specific overrides (not in .env.local)
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # Next.js App URL (updated by Python script with ngrok URL)
      - NEXT_APP_URL=${NEXT_APP_URL:-https://revenuegrowth.ngrok.app}
      # All other variables come from .env.local
    volumes:
      - ./workers:/app
    restart: unless-stopped
    depends_on:
      - chroma
    networks:
      - shared-infra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ChromaDB Vector Database
  chroma:
    image: chromadb/chroma:0.4.24
    container_name: chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - /mnt/chroma-data-v0424:/chroma/chroma
    networks:
      - shared-infra-network
    restart: unless-stopped

  # Redis Cache (shared by Vani and other services)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - shared-infra-network
    restart: unless-stopped
    # stop-writes-on-bgsave-error no: allow writes when RDB save fails (e.g. disk full/permissions)
    # bind 0.0.0.0 so other containers (celery-worker, etc.) can connect
    command: redis-server --appendonly yes --stop-writes-on-bgsave-error no --bind 0.0.0.0
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Celery Worker for VANI campaign/CRM/workflow tasks
  celery-worker:
    build:
      context: ../vani  # Build from VANI project directory
      dockerfile: Dockerfile
    container_name: celery-worker
    env_file:
      - ../vani/.env.local  # Use VANI's environment variables
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_ENABLED=${CELERY_ENABLED:-true}
      - DOCKER_CONTAINER=true
    networks:
      - shared-infra-network
    volumes:
      # Mount VANI code so Celery can import task modules
      - ../vani:/app/vani:ro
    working_dir: /app/vani
    command: >
      sh -c "
        if [ \"$$CELERY_ENABLED\" = \"true\" ]; then
          celery -A app.config.celery_config.celery_app worker 
            --loglevel=info 
            --queues=campaigns,crm_sync,workflows
            --hostname=celery-worker@%h
        else
          echo 'Celery worker disabled (CELERY_ENABLED=false)'
          sleep infinity
        fi
      "
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.config.celery_config.celery_app inspect ping -d celery-worker@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Beat for VANI (scheduler: enqueues periodic tasks to Redis; worker runs them)
  celery-beat:
    build:
      context: ../vani
      dockerfile: Dockerfile
    container_name: celery-beat
    env_file:
      - ../vani/.env.local
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DOCKER_CONTAINER=true
    networks:
      - shared-infra-network
    volumes:
      - ../vani:/app/vani:ro
    working_dir: /app/vani
    command: celery -A app.config.celery_config.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  shared-infra-network:
    name: shared-infra-network
    driver: bridge
    # External network - can be referenced by other projects

volumes:
  redis-data:
    driver: local
